name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleRelease
      - run: shellcheck install.sh

  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse install.ps1 in Windows PowerShell 5.1 and PowerShell 7
        shell: pwsh
        run: |
          foreach ($exe in "powershell", "pwsh") {
            & $exe -NoProfile -Command {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
              if ($errors) { $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
              "parsed OK in $($PSVersionTable.PSVersion)"
            }
            if ($LASTEXITCODE) { exit 1 }
          }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost, PSAvoidUsingInvokeExpression, PSUseApprovedVerbs, PSUseSingularNouns
          $issues | Format-Table -AutoSize
          if ($issues | Where-Object Severity -eq Error) { exit 1 }
      - name: Download adb, then stop cleanly on a bad TV address (no TV here)
        shell: pwsh
        run: |
          # Hide the runner's own adb so the script downloads Google's.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'adb.exe')) }) -join ';'
          $env:KIDS_TV_HOME = "$env:RUNNER_TEMP\kt"
          try { & .\install.ps1 -TitlesOnly -Tv "not-an-address" } catch { "stopped: $_" }
          if (-not (Test-Path "$env:KIDS_TV_HOME\platform-tools\adb.exe")) { throw "adb wasn't downloaded" }
          & "$env:KIDS_TV_HOME\platform-tools\adb.exe" version
