name: release
# Push a tag like v0.2.0 → builds the signed APK and publishes it as a GitHub release.
# The installers download releases/latest/download/kids-tv.apk.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KIDS_TV_KEYSTORE_BASE64 }}
          KIDS_TV_KEYSTORE_PASSWORD: ${{ secrets.KIDS_TV_KEYSTORE_PASSWORD }}
          KIDS_TV_KEY_PASSWORD: ${{ secrets.KIDS_TV_KEYSTORE_PASSWORD }}
          KIDS_TV_KEY_ALIAS: kids-tv
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::secret KIDS_TV_KEYSTORE_BASE64 is missing"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::tag must be vMAJOR.MINOR.PATCH"; exit 1; }
          # Android only installs a higher versionCode over an older one: derive it from the tag.
          code=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          export KIDS_TV_KEYSTORE="$RUNNER_TEMP/release.p12"
          ./gradlew assembleRelease -PversionName="$version" -PversionCode="$code"
          cp app/build/outputs/apk/release/app-release.apk kids-tv.apk
          sha256sum kids-tv.apk > kids-tv.apk.sha256
          # Fail rather than publish an APK signed with the throwaway debug key.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs kids-tv.apk | grep -q "CN=Kids TV" \
            || { echo "::error::APK isn't signed with the release key"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" kids-tv.apk kids-tv.apk.sha256 --title "$GITHUB_REF_NAME" --generate-notes
